<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="一幅纯 SVG 绘制的海边小插画：戴着头盔、系着红围巾的鹈鹕，骑着绿色自行车悠闲出游。">
  <title>今天，慢慢骑。｜鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf7ed;
      --ink: #294548;
      --muted: #73847b;
      --line: #d9ded0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 30px;
      background: #e9ede5;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .poster {
      width: min(1040px, 100%);
      overflow: hidden;
      border: 1px solid #d5dccf;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 14px 48px #334a3810;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 44px;
      padding: 24px 0 18px;
      border-bottom: 1px solid var(--line);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.1px;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 1px solid #a7b8a8;
      border-radius: 50%;
    }
    .edition { color: var(--muted); white-space: nowrap; }
    .intro { padding: 27px 30px 0; text-align: center; }
    .eyebrow {
      margin: 0 0 9px;
      color: #9b714e;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 4px;
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
      font-size: clamp(29px, 4.1vw, 46px);
      font-weight: 600;
      letter-spacing: 5px;
      line-height: 1.4;
    }
    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
    }
    figure { margin: -5px 8px 0; }
    .illustration { display: block; width: 100%; height: auto; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: -5px 44px 0;
      padding: 18px 0 23px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.7px;
    }
    .footer strong { color: var(--ink); font-weight: 500; }
    .footer em {
      color: #7e8e7d;
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: .3px;
    }
    @media (max-width: 620px) {
      body { padding: 14px; }
      .poster { border-radius: 13px; }
      .masthead { margin: 0 20px; padding-top: 18px; font-size: 8px; letter-spacing: 1.2px; }
      .brand { gap: 7px; }
      .edition { font-size: 8px; letter-spacing: .7px; }
      .intro { padding: 27px 12px 7px; }
      .eyebrow { font-size: 8px; letter-spacing: 2.4px; }
      .subtitle { font-size: 10px; letter-spacing: 1.4px; }
      figure { margin: 0 -11px; }
      .footer { margin: 0 20px; padding: 15px 0 18px; font-size: 8px; letter-spacing: .8px; }
      .footer em { font-size: 11px; }
    }
    @media print {
      body { display: block; padding: 0; background: white; }
      .poster { width: 100%; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
