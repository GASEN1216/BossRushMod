name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wiki-site/**'
      - 'WikiContent/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress 的 lastUpdated 取 git 提交时间。默认浅克隆（depth 1）里
          # 每个文件都只有那一个提交，全站「最后更新」会显示成同一天。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki-site/package-lock.json

      - name: Install dependencies
        working-directory: wiki-site
        run: npm ci

      - name: Build
        working-directory: wiki-site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki-site/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
