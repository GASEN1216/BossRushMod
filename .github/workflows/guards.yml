name: Guards

# tests/ 下的 Python 守卫是本仓库最大的质量资产（440 个结构不变式脚本），
# 但此前只能靠本地手动跑——CI 里只有 Wiki 部署，没有任何 guard。
#
# 这里只跑 guard，**不跑编译**：compile_official.bat 需要
# Duckov_Data\Managed 下的游戏程序集，CI runner 上没有，也不该有。
# 编译与实机 smoke 仍然只能在装有《鸭科夫》的 Windows 机器上做。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source guards (external artifacts reported separately)
        env:
          # guard 输出中文；不固定 UTF-8 会在部分 runner 上乱码
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tools/run_guards.py --source-only --verbose

# 说明：
# - 已知红项登记在 tests/known_red_guards.txt，失败不影响退出码，但会单独列出。
# - 基线里登记却已转绿的条目会被报为 STALE-BASELINE 并判失败，防止基线越积越多掩盖回归。
# - 本地等价命令：run_guards.bat（Windows）或 python tools/run_guards.py
