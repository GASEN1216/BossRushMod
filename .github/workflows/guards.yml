name: Guards

# tests/ 下的 Python 守卫是本仓库最大的质量资产（数百个结构不变式脚本，数量以 runner 输出为准），
# 但此前只能靠本地手动跑——CI 里只有 Wiki 部署，没有任何 guard。
#
# CI 运行源码守卫和物品冷读档执行回归。正式 Mod 编译仍使用本机游戏程序集。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  item-restore:
    name: 角色装备与仓库冷读档
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 运行无游戏依赖的物品恢复回归
        run: >-
          python tools/run_runtime_regressions.py --fixtures
          DynamicItemInitialization EquipmentConfiguratorRegistry ResourceProduction
          IntegrationLeafOwners TidegateTreasure

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 图像属性测试需要 Pillow，道路几何属性测试需要 Shapely；缺依赖时报失败。
      - name: Install image and geometry property test dependencies
        run: python -m pip install --disable-pip-version-check Pillow "Shapely>=2.1,<3"

      - name: Run source guards (external artifacts reported separately)
        env:
          # guard 输出中文；不固定 UTF-8 会在部分 runner 上乱码
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tools/run_guards.py --source-only --verbose

# 说明：
# - 已知红项登记在 tests/known_red_guards.txt，失败不影响退出码，但会单独列出。
# - 基线里登记却已转绿的条目会被报为 STALE-BASELINE 并判失败，防止基线越积越多掩盖回归。
# - 本地等价命令：run_guards.bat（Windows）或 python tools/run_guards.py
